name: Build Spam Spotter message checker

on:
  push:
    branches:
      - native-message-checker-beta
    paths:
      - 'android-message-checker/**'
      - '.github/workflows/message-checker-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        working-directory: android-message-checker
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: spam-spotter-message-checker-debug
          path: android-message-checker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
